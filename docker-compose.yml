services:
  mysql:
    image: mysql:8.0
    container_name: librune-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: librune
      MYSQL_USER: librune
      MYSQL_PASSWORD: librune_password
      MYSQL_ROOT_PASSWORD: librune_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ulibrune", "-plibrune_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: librune-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/librune?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: librune
      SPRING_DATASOURCE_PASSWORD: librune_password
      APP_UPLOAD_DIR: /app/uploads
    volumes:
      - ./uploads:/app/uploads

volumes:
  mysql_data:
