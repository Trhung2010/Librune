spring.application.name=librune
server.port=8080

# Local MySQL defaults (override via env vars or docker profile)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/librune?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate strictly validates Entities against schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Run idempotent schema.sql & data.sql automatically if needed
spring.sql.init.mode=always

# Book cover upload settings (persisted via Docker volume in production)
app.upload.dir=${APP_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
