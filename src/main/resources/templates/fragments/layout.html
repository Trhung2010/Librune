<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | Librune'">Librune</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/librune.css}">
</head>
<body>

<aside th:fragment="sidebar(activePage)" class="admin-sidebar">
    <div class="brand">
        <i class="bi bi-book-half me-2"></i>LIBRUNE ADMIN
    </div>
    <nav class="nav flex-column mt-2">
        <a class="nav-link" th:classappend="${activePage == 'dashboard'} ? ' active'" th:href="@{/admin/dashboard}">
            <i class="bi bi-speedometer2 me-2"></i>Thống kê
        </a>
        <a class="nav-link" th:classappend="${activePage == 'books'} ? ' active'" th:href="@{/admin/books}">
            <i class="bi bi-journal-bookmark me-2"></i>Quản lý Sách
        </a>
        <a class="nav-link" th:classappend="${activePage == 'categories'} ? ' active'" th:href="@{/admin/categories}">
            <i class="bi bi-tags me-2"></i>Quản lý Danh mục
        </a>
        <a class="nav-link" th:classappend="${activePage == 'authors'} ? ' active'" th:href="@{/admin/authors}">
            <i class="bi bi-pen me-2"></i>Quản lý Tác giả
        </a>
        <a class="nav-link" th:classappend="${activePage == 'readers'} ? ' active'" th:href="@{/admin/readers}">
            <i class="bi bi-people me-2"></i>Quản lý Độc giả
        </a>
        <a class="nav-link" th:classappend="${activePage == 'borrows'} ? ' active'" th:href="@{/admin/borrows}">
            <i class="bi bi-arrow-left-right me-2"></i>Mượn / Trả sách
        </a>
        <hr class="border-light opacity-25 mx-3 my-2">
        <a class="nav-link" th:href="@{/}">
            <i class="bi bi-house me-2"></i>Trang chính
        </a>
    </nav>
    <div class="mt-auto p-3 border-top border-light border-opacity-10">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light btn-sm w-100">
                <i class="bi bi-box-arrow-right me-1"></i>Đăng xuất
            </button>
        </form>
    </div>
</aside>

<header th:fragment="topbar(title)" class="admin-topbar">
    <h5 class="mb-0 fw-semibold" th:text="${title}">Dashboard</h5>
    <div class="d-flex align-items-center gap-2 text-muted small">
        <i class="bi bi-person-circle"></i>
        <span sec:authentication="name">admin</span>
    </div>
</header>

<div th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
</body>
</html>
