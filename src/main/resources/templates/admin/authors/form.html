<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${author.id != null ? 'Sửa tác giả' : 'Thêm tác giả'})}"></head>
<body>
<div class="admin-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar(${activePage})}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/layout :: topbar(${author.id != null ? 'Cập nhật Tác giả' : 'Thêm Tác giả Mới'})}"></header>
        <div class="admin-content">
            <div class="card border-0 shadow-sm" style="max-width: 640px;">
                <div class="card-body p-4">
                    <form th:action="@{/admin/authors/save}" method="post">
                        <input type="hidden" name="id" th:value="${author.id}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tên tác giả *</label>
                            <input type="text" class="form-control" name="name" th:value="${author.name}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tiểu sử</label>
                            <textarea class="form-control" name="biography" rows="4" th:text="${author.biography}"></textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Lưu</button>
                            <a th:href="@{/admin/authors}" class="btn btn-outline-secondary">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
