<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý Tác giả')}"></head>
<body>
<div class="admin-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar(${activePage})}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/layout :: topbar('Quản lý Tác giả')}"></header>
        <div class="admin-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="card border-0 shadow-sm mb-3">
                <div class="card-body">
                    <form class="row g-2 align-items-center" th:action="@{/admin/authors}" method="get">
                        <div class="col-md-6">
                            <input type="text" class="form-control" name="keyword" th:value="${keyword}"
                                   placeholder="Tìm theo tên tác giả...">
                        </div>
                        <div class="col-md-6 d-flex gap-2 justify-content-end">
                            <button type="submit" class="btn btn-outline-primary">Tìm</button>
                            <a th:href="@{/admin/authors/new}" class="btn btn-primary">
                                <i class="bi bi-plus-lg me-1"></i>Thêm tác giả
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Tên tác giả</th>
                        <th>Tiểu sử</th>
                        <th class="text-end">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(authors)}">
                        <td colspan="4" class="text-center py-4 text-muted">Không có tác giả nào.</td>
                    </tr>
                    <tr th:each="a : ${authors}">
                        <td th:text="${a.id}"></td>
                        <td class="fw-semibold" th:text="${a.name}"></td>
                        <td th:text="${a.biography}"></td>
                        <td class="text-end">
                            <a th:href="@{'/admin/authors/' + ${a.id} + '/edit'}" class="btn btn-sm btn-outline-secondary">Sửa</a>
                            <form th:action="@{'/admin/authors/' + ${a.id} + '/delete'}" method="post" class="d-inline"
                                  onsubmit="return confirm('Xác nhận xóa tác giả này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
