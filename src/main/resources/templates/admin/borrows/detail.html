<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Chi tiết Phiếu mượn')}"></head>
<body>
<div class="admin-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar(${activePage})}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/layout :: topbar('Chi tiết Phiếu mượn #' + ${borrow.id})}"></header>
        <div class="admin-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="row g-4">
                <div class="col-lg-7">
                    <div class="card-modern mb-4">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span class="fw-bold">Thông tin phiếu mượn</span>
                            <span class="badge-soft"
                                  th:classappend="${borrow.status == 'PENDING' ? 'badge-soft-warning' :
                                                   (borrow.status == 'APPROVED' ? 'badge-soft-info' :
                                                   (borrow.status == 'RETURNED' ? 'badge-soft-success' : 'badge-soft-danger'))}"
                                  th:text="${borrow.status}"></span>
                        </div>
                        <div class="card-body">
                            <div class="row g-3 small">
                                <div class="col-sm-6">
                                    <div class="text-muted">Độc giả</div>
                                    <div class="fw-semibold fs-6">
                                        <a th:href="@{'/admin/readers/' + ${borrow.user.id}}" class="text-decoration-none"
                                           th:text="${borrow.user.fullName + ' (@' + borrow.user.username + ')'}"></a>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="text-muted">Ngày gửi yêu cầu</div>
                                    <div class="fw-semibold" th:text="${borrow.requestDate != null ? #temporals.format(borrow.requestDate, 'dd/MM/yyyy HH:mm') : '-'}"></div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="text-muted">Ngày duyệt</div>
                                    <div class="fw-semibold" th:text="${borrow.borrowDate != null ? #temporals.format(borrow.borrowDate, 'dd/MM/yyyy HH:mm') : '-'}"></div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="text-muted">Hạn trả dự kiến</div>
                                    <div class="fw-semibold" th:text="${borrow.dueDate != null ? #temporals.format(borrow.dueDate, 'dd/MM/yyyy') : '-'}"></div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="text-muted">Ngày trả thực tế</div>
                                    <div class="fw-semibold" th:text="${borrow.returnDate != null ? #temporals.format(borrow.returnDate, 'dd/MM/yyyy HH:mm') : '-'}"></div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="text-muted">Người xử lý</div>
                                    <div class="fw-semibold" th:text="${borrow.approvedBy != null ? borrow.approvedBy.fullName : '-'}"></div>
                                </div>
                                <div class="col-12">
                                    <div class="text-muted">Ghi chú</div>
                                    <div class="fw-medium" th:text="${borrow.note != null and !borrow.note.isBlank() ? borrow.note : '-'}"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card-modern">
                        <div class="card-header fw-bold">Danh sách sách trong phiếu</div>
                        <div class="table-responsive">
                            <table class="table table-modern mb-0">
                                <thead>
                                <tr>
                                    <th>Tên sách</th>
                                    <th>Số lượng mượn</th>
                                    <th>Còn trong kho</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="d : ${borrow.details}">
                                    <td class="fw-semibold" th:text="${d.book.title}"></td>
                                    <td><span class="badge-soft badge-soft-indigo" th:text="${d.quantity}"></span></td>
                                    <td>
                                        <span class="badge-soft"
                                              th:classappend="${d.book.availableQuantity < d.quantity} ? 'badge-soft-danger' : 'badge-soft-success'"
                                              th:text="${d.book.availableQuantity + ' / ' + d.book.totalQuantity}"></span>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="col-lg-5">
                    <div th:if="${borrow.status == 'PENDING'}" class="card-modern mb-3">
                        <div class="card-header fw-bold">Duyệt hoặc Từ chối phiếu</div>
                        <div class="card-body p-4">
                            <form th:action="@{'/admin/borrows/' + ${borrow.id} + '/approve'}" method="post"
                                  class="mb-4 needs-validation" novalidate>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold" for="dueDateInput">Hạn trả dự kiến</label>
                                    <input id="dueDateInput" type="date" class="form-control" name="dueDate"
                                           th:value="${defaultDueDate}" th:attr="min=${minDueDate}" required>
                                    <div class="invalid-feedback">Hạn trả phải từ ngày hôm nay trở đi.</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold" for="approveNoteInput">Ghi chú (tùy chọn)</label>
                                    <input id="approveNoteInput" type="text" class="form-control" name="note"
                                           placeholder="Ghi chú cho độc giả...">
                                </div>
                                <button type="submit" class="btn btn-success w-100 fw-semibold">
                                    <i class="bi bi-check-circle me-1"></i>Duyệt &amp; Trừ tồn kho
                                </button>
                            </form>
                            <hr>
                            <form th:action="@{'/admin/borrows/' + ${borrow.id} + '/reject'}" method="post"
                                  data-confirm="Xác nhận từ chối phiếu mượn này?">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold" for="rejectNoteInput">Lý do từ chối</label>
                                    <input id="rejectNoteInput" type="text" class="form-control" name="note"
                                           placeholder="Nhập lý do từ chối...">
                                </div>
                                <button type="submit" class="btn btn-outline-danger w-100 fw-semibold">
                                    <i class="bi bi-x-circle me-1"></i>Từ chối phiếu
                                </button>
                            </form>
                        </div>
                    </div>

                    <div th:if="${borrow.status == 'APPROVED'}" class="card-modern mb-3">
                        <div class="card-header fw-bold">Xác nhận trả sách</div>
                        <div class="card-body p-4">
                            <form th:action="@{'/admin/borrows/' + ${borrow.id} + '/return'}" method="post"
                                  data-confirm="Xác nhận độc giả đã trả đủ sách và hoàn lại tồn kho?">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold" for="returnNoteInput">Ghi chú tình trạng sách khi trả</label>
                                    <input id="returnNoteInput" type="text" class="form-control" name="note"
                                           placeholder="Nguyên vẹn / đầy đủ...">
                                </div>
                                <button type="submit" class="btn btn-primary w-100 fw-semibold">
                                    <i class="bi bi-arrow-return-left me-1"></i>Xác nhận đã trả &amp; Hoàn kho
                                </button>
                            </form>
                        </div>
                    </div>

                    <a th:href="@{/admin/borrows}" class="btn btn-outline-secondary">← Quay lại danh sách</a>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
