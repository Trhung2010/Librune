<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý Danh mục')}"></head>
<body>
<div class="admin-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar(${activePage})}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/layout :: topbar('Quản lý Danh mục')}"></header>
        <div class="admin-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="d-flex justify-content-end mb-3">
                <a th:href="@{/admin/categories/new}" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-1"></i>Thêm danh mục
                </a>
            </div>

            <div class="card border-0 shadow-sm">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Tên danh mục</th>
                        <th>Mô tả</th>
                        <th class="text-end">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(categories)}">
                        <td colspan="4" class="text-center py-4 text-muted">Chưa có danh mục nào.</td>
                    </tr>
                    <tr th:each="c : ${categories}">
                        <td th:text="${c.id}"></td>
                        <td class="fw-semibold" th:text="${c.name}"></td>
                        <td th:text="${c.description}"></td>
                        <td class="text-end">
                            <a th:href="@{'/admin/categories/' + ${c.id} + '/edit'}" class="btn btn-sm btn-outline-secondary">Sửa</a>
                            <form th:action="@{'/admin/categories/' + ${c.id} + '/delete'}" method="post" class="d-inline"
                                  onsubmit="return confirm('Xác nhận xóa danh mục này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
