<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head(${category.id != null ? 'Cập nhật Danh mục' : 'Thêm Danh mục'})}"></head>
<body>
<div class="admin-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar(${activePage})}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/layout :: topbar(${category.id != null ? 'Cập nhật Danh mục' : 'Thêm Danh mục'})}"></header>
        <div class="admin-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="card-modern" style="max-width: 680px;">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h6 class="mb-0 fw-bold" th:text="${category.id != null ? 'Chỉnh sửa danh mục #' + category.id : 'Thông tin danh mục mới'}"></h6>
                    <a th:href="@{/admin/categories}" class="btn btn-sm btn-outline-secondary">← Quay lại</a>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/categories/save}" th:object="${category}" method="post"
                          class="needs-validation" novalidate>
                        <input type="hidden" th:field="*{id}" />
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="name">Tên danh mục <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                   maxlength="100" required placeholder="VD: Công nghệ thông tin" />
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            <div class="invalid-feedback" th:unless="${#fields.hasErrors('name')}">Vui lòng nhập tên danh mục (tối đa 100 ký tự).</div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold" for="description">Mô tả</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="3"
                                      placeholder="Mô tả ngắn gọn về thể loại sách trong danh mục..."></textarea>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/admin/categories}" class="btn btn-outline-secondary">Hủy</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check2-circle me-1"></i>
                                <span th:text="${category.id != null ? 'Cập nhật' : 'Thêm mới'}">Lưu</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
