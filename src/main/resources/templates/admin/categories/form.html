<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${category.id != null ? 'Sửa danh mục' : 'Thêm danh mục'})}"></head>
<body>
<div class="admin-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar(${activePage})}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/layout :: topbar(${category.id != null ? 'Cập nhật Danh mục' : 'Thêm Danh mục Mới'})}"></header>
        <div class="admin-content">
            <div class="card border-0 shadow-sm" style="max-width: 640px;">
                <div class="card-body p-4">
                    <form th:action="@{/admin/categories/save}" method="post">
                        <input type="hidden" name="id" th:value="${category.id}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tên danh mục *</label>
                            <input type="text" class="form-control" name="name" th:value="${category.name}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mô tả</label>
                            <textarea class="form-control" name="description" rows="3" th:text="${category.description}"></textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Lưu</button>
                            <a th:href="@{/admin/categories}" class="btn btn-outline-secondary">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
